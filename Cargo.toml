[workspace]
members = [
    "crates/akzio-domain",
    "crates/akzio-store",
    "crates/akzio-context",
    "crates/akzio-ingest",
    "crates/akzio-runtime",
    "crates/akzio-execution",
    "crates/akzio-learning",
    "crates/akzio-model",
    "crates/akzio-research",
    "crates/akzio-daemon",
    "crates/akzio-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0.95"
chrono = { version = "0.4.39", features = ["serde"] }
clap = { version = "4.5.26", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures = "0.3.31"
fs2 = "0.4.3"
html-escape = "0.2.13"
md-5 = "0.10.6"
regex = "1.11.1"
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "json", "query", "rustls"] }
async-openai = { version = "0.41.1", features = ["responses", "chat-completion", "middleware", "byot"] }
async-stream = "0.3.6"
axum = "0.8.4"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
serde_yaml = "0.9.34"
sha2 = "0.10.8"
rusqlite = { version = "0.32.1", features = ["bundled"] }
 tower = "0.5.3"
tempfile = "3.15.0"
thiserror = "2.0.11"
toml = "0.8"
tokio = { version = "1.43.0", features = ["full"] }
tokio-stream = "0.1.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.12.0", features = ["v4", "serde"] }
