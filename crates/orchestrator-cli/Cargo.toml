path = "src/bin/report_email.rs"

[[bin]]
name = "run-daily-tqqq-report"
path = "src/bin/run_daily_tqqq_report.rs"

[[bin]]
name = "orchestrator-ingest"
path = "src/bin/orchestrator_ingest.rs"

[[bin]]
name = "orchestrator-prompt-lint"
path = "src/bin/orchestrator_prompt_lint.rs"

[[bin]]
name = "orchestrator-store-doctor"
path = "src/bin/orchestrator_store_doctor.rs"

[[bin]]
name = "orchestrator-memory"
path = "src/bin/orchestrator_memory.rs"
