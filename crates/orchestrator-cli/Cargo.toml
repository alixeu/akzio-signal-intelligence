[package]
name = "orchestrator-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
regex.workspace = true
orchestrator-core = { path = "../orchestrator-core" }
orchestrator-llm = { path = "../orchestrator-llm" }
orchestrator-ingest = { path = "../orchestrator-ingest" }
orchestrator-store = { path = "../orchestrator-store" }
orchestrator-workflow = { path = "../orchestrator-workflow" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde_yaml.workspace = true
tempfile.workspace = true

