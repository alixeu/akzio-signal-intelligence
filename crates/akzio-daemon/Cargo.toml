# 文件职责：声明常驻 Daemon、HTTP/SSE、调度和 worker 分发 crate 的依赖边界。
[package]
name = "akzio-daemon"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 通过 workspace crate 依赖调用 Domain/Store/Runtime/Execution 等权威实现；Axum/Tokio
# 提供传输和任务驱动，daemon 本身不取代这些 crate 的 Contract/Gate/持久化边界。
[dependencies]
akzio-domain = { path = "../akzio-domain" }
akzio-execution = { path = "../akzio-execution" }
akzio-ingest = { path = "../akzio-ingest" }
akzio-learning = { path = "../akzio-learning" }
akzio-context = { path = "../akzio-context" }
akzio-model = { path = "../akzio-model" }
akzio-research = { path = "../akzio-research" }
akzio-runtime = { path = "../akzio-runtime" }
akzio-store = { path = "../akzio-store" }
async-stream.workspace = true
axum.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# 测试使用独立 HTTP client 访问本地 handler，不加入 daemon 的生产依赖。
reqwest.workspace = true
