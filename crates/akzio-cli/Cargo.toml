# 文件职责：声明 akzio CLI 二进制及其对 Daemon、Domain、Execution、Research 和 Store 的编排依赖。
[package]
name = "akzio-cli"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
default-run = "akzio"

# 二进制入口是 Clap 参数组合根；build.rs 在编译阶段提供源码修订与 rustc 版本身份，
# 它不是运行期 daemon，也不启动 Store 或 Paper 任务。
[[bin]]
name = "akzio"
path = "src/main.rs"

# 运行期依赖覆盖 CLI 控制/API、配置序列化、模型资格和本地校准/证据工具。
[dependencies]
akzio-daemon = { path = "../akzio-daemon" }
akzio-domain = { path = "../akzio-domain" }
akzio-execution = { path = "../akzio-execution" }
akzio-ingest = { path = "../akzio-ingest" }
akzio-learning = { path = "../akzio-learning" }
akzio-model = { path = "../akzio-model" }
akzio-research = { path = "../akzio-research" }
akzio-store = { path = "../akzio-store" }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true

[build-dependencies]
# 仅供 build.rs 计算源码身份摘要；不参与 CLI 运行时依赖图。
sha2.workspace = true
