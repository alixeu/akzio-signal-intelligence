# 文件导读：CLI 初始化用户配置时使用的 Paper-engineering 模板；初始化入口将本文件
# 派生成用户配置，再由 Core 读取 daemon、execution、model、credential 与展示偏好各节。
# CLI 复制并替换环境占位符；它不代表已经通过审批、校准或 Paper Gate。
[daemon]
# Overridden at launch with AKZIO_STORE_ROOT so Finder launches never depend
# on the current working directory.
store_root = ".akzio/store"
http_addr = "127.0.0.1:7342"
# The formal Core reads or creates the same `.daemon-token` file before launch;
# CLI clients reuse the token file under Store Root.
worker_count = 4
# Constructs Alpaca Paper from environment credentials and fails closed before
# scheduler startup when credentials, endpoint, or Paper prerequisites are invalid.
auto_paper = false
# Allow explicit client requests through the existing Paper scheduler and Gates.
manual_paper = true

[execution]
# 这里只声明运行 profile、资产白名单与计价假设，不代表目标仓位、订单或成交。
experiment_profile = "paper-engineering"
assets = ["TQQQ", "QQQ", "SOXX", "SOXL"]
market_data_feed = "iex"
transaction_cost_ppm = 100
slippage_ppm = 50

[model]
# 环境占位符解析后才得到实际端点与凭据；读取配置不等于已经完成 provider capability probe。
provider = "openai_responses"
base_url = "$LLM_GATEWAY_BASE_URL"
model = "gpt-5.6-luna"
api_key = "$LLM_GATEWAY_API_KEY"
reasoning_effort = "low"
response_language = "简体中文"

# CLI initialization copies this template to ~/.akzio/config.toml, replaces
# environment placeholders, and enforces owner-only file permissions.
[credentials]
# 初始化时由环境变量替换或由用户编辑配置文件；空字符串表示尚未填写。
alpaca_api_key = ""
alpaca_api_secret = ""
fred_api_key = ""

[observatory]
# 以下是展示偏好，与 Core 的交易/研究状态相互独立。
