# 文件职责：macOS Observatory 初始化用户配置时使用的 Paper-engineering 模板。
# App 复制并替换环境占位符；它不代表已经通过审批、校准或 Paper Gate。
[daemon]
# Overridden at launch with AKZIO_STORE_ROOT so Finder launches never depend
# on the current working directory.
store_root = ".akzio/store"
http_addr = "127.0.0.1:7342"
# The macOS Observatory reads or creates the same `.daemon-token` file before launch;
# The CLI and macOS Observatory reuse the token file under Store Root.
worker_count = 4
# Constructs Alpaca Paper from environment credentials and fails closed before
# scheduler startup when credentials, endpoint, or Paper prerequisites are invalid.
auto_paper = false
# Allow explicit App requests through the existing Paper scheduler and Gates.
manual_paper = true

[execution]
experiment_profile = "paper-engineering"
assets = ["TQQQ", "QQQ", "SOXX", "SOXL"]
market_data_feed = "iex"
transaction_cost_ppm = 100
slippage_ppm = 50

[model]
provider = "openai_responses"
base_url = "$LLM_GATEWAY_BASE_URL"
model = "gpt-5.6-luna"
api_key = "$LLM_GATEWAY_API_KEY"
reasoning_effort = "low"
response_language = "简体中文"
debug = false

# App initialization copies this template to ~/.akzio/config.toml, replaces
# environment placeholders, and enforces owner-only file permissions.
[credentials]
alpaca_api_key = ""
alpaca_api_secret = ""
fred_api_key = ""

[observatory]
