[daemon]
store_root = "outputs/akzio-v2-rebuild"
http_addr = "127.0.0.1:7342"
token_env = "AKZIO_DAEMON_TOKEN"
worker_count = 4
# Paper sessions require an injected scheduler loop. The CLI fails closed if this is true.
auto_paper = false

[execution]
assets = ["TQQQ", "QQQ", "SOXX", "SOXL"]

# Copy this file to config/akzio.local.toml before adding a real API key, then
# start the daemon with `--config config/akzio.local.toml`.
[model]
base_url = "$LLM_GATEWAY_BASE_URL"
model = "gpt-5.6-luna"
api_key = "$LLM_GATEWAY_API_KEY"
reasoning_effort = "low"
debug = true
