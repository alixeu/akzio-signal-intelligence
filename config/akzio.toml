[daemon]
store_root = ".akzio/store"
http_addr = "127.0.0.1:7342"
# The CLI generates or reads
# `.daemon-token` under `store_root` with owner-only permissions.
worker_count = 4
# false starts only the loopback API and workers. true constructs Alpaca Paper
# from environment credentials, preflights the workflow, and starts the scheduler.
auto_paper = false

[execution]
experiment_profile = "fixture"
assets = ["TQQQ", "QQQ", "SOXX", "SOXL"]
market_data_feed = "iex"
# Explicit parts-per-million assumptions used only when sealing Outcome windows.
# Keep zero for fixtures; Paper launch approval must set audited values.
transaction_cost_ppm = 0
slippage_ppm = 0

# Copy this file to config/akzio.local.toml before adding a real API key, then
# start the daemon with `--config config/akzio.local.toml`.
[model]
provider = "openai_responses"
base_url = "$LLM_GATEWAY_BASE_URL"
model = "gpt-5.6-luna"
api_key = "$LLM_GATEWAY_API_KEY"
reasoning_effort = "low"
response_language = "简体中文"
debug = false

# Agent resource defaults; role overrides use the same fields.
# Input is cumulative across LLM requests in one Attempt, not a context window.
# Output and timeout retain their per-role defaults when omitted.
[agent.budget.default]
max_input_tokens = 1000000
max_tool_calls = "unlimited"

# Optional finite limit for one role:
# [agent.budget.analyst]
# max_tool_calls = 8
# max_output_tokens = 12000
# timeout_seconds = 180
# Also supported: planner, critic, synthesizer, outcome_worker.
# See docs/agent-budget-configuration.md.
