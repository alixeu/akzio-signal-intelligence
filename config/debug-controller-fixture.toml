# 文件职责：离线 Debug Controller 验证的隔离配置。
# debug_control 和禁止 Paper 的设置只作用于该 fixture Core，不改变 canonical Store。
# Offline controller proof only. No credentials, network providers or Broker.
[daemon]
# Keep checkpoints outside build products removed by distribution packaging.
store_root = ".akzio/debug-controller-store"
http_addr = "127.0.0.1:17342"
worker_count = 8
auto_paper = false
debug_control = true
outcome_processing = true

[execution]
experiment_profile = "fixture"
assets = ["TQQQ", "QQQ", "SOXX", "SOXL"]
market_data_feed = "sip"
