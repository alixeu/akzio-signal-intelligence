orchestrator:
  analysis_universe: [QQQ, SOXX, VIX]
  store:
    root: outputs/store
    atomic_fsync: true
    stale_temp_age_sec: 3600

  tool_managed:
    max_summary_units_per_phase: 32

  runtime:
    lang: zh
    # window_days: 数据检索窗口（技术与新闻上下文工具返回的时间跨度）。
    # 与 technical.days 对齐;分析判断窗口(1-5 交易日)由各 analyst prompt 内部定义。
    window_days: 60
    max_debate_rounds: 3
    # Each Bull/Bear side participates in at most this many topic lanes.
    max_topics_per_side: 3

  retrieval:
    summary_page_limit: 20
    detail_page_limit: 20
    phase2_max_details: 4
    phase3_max_details: 6
    phase4_max_details: 2
    phase5_max_details: 4
    phase6_max_details: 8
    reflection_max_details: 8

  allocation:
    investable_assets: [QQQ, SOXX]

  alpaca:
    # Paper Trading credentials, loaded from .env or the process environment.
    # Never commit real credentials. Orders use paper-api.alpaca.markets only.
    api_key: ${ALPACA_API_KEY}
    api_secret: ${ALPACA_API_SECRET}
    order_submission_enabled: true
    # Debug never contacts Alpaca. It seeds 20% of equity across investable
    # assets so both buy and sell paths can produce deterministic simulated fills.
    debug_starting_cash: 10000

  reflection:
    task_limit: 10
    # MemoryPolicyV1: quotas are intentionally configurable rather than
    # hard-coded.  6/2/2 is the initial new/retry/backlog split.
    policy_version: 1
    new_outcome_quota: 6
    retry_quota: 2
    backlog_quota: 2
    # A failed Historical Reflector remains non-blocking and retries only
    # within this explicit bound; policy changes are recorded in Task Keys.
    max_attempts: 3
  # Goal 1 ships disabled until the owner approves strict per-ticker benchmark
  # mappings and provider/price-basis provenance. Missing mappings are a Gap,
  # never a silent fallback.
  evaluation:
    enabled: false
    canonical_memory_writes_enabled: false
    policy_version: 1
    default_run_purpose: paper
    evaluation_contract_id: primary-three-day
    prediction_horizon_trading_days: 3
    # This is intentionally the literal existing `Close` column. Do not set
    # adjusted_close until the provider export includes that distinct column.
    price_basis: close
    market_data_provider: technical_csv
    market_data_adjustment_policy: unknown
    corporate_action_capability: unknown
    benchmarks: {}
  workflow:
    agent_timeout_sec: 600

  prompts:
    reflection:
      historical: prompts/phase0/historical_reflection.md
    analyst:
      technical: prompts/phase1/technical.md
      news_macro: prompts/phase1/news_macro.md
    compressor:
      phase0: prompts/phase0/summary.md
      phase1: prompts/phase1/summary.md
      phase2: prompts/phase2/summary.md
      phase3: prompts/phase3/summary.md
      phase4: prompts/phase4/summary.md
      phase5: prompts/phase5/summary.md
      phase6: prompts/phase6/summary.md
    phase2:
      topic_generator: prompts/phase2/topic_generator.md
      warmup: prompts/phase2/researcher/warmup.md
      bull_initial: prompts/phase2/researcher/debate.md
      bull_interaction: prompts/phase2/researcher/debate.md
      bear_initial: prompts/phase2/researcher/debate.md
      bear_interaction: prompts/phase2/researcher/debate.md
      web_evidence: prompts/phase2/web_evidence_researcher.md
    mediator:
      topic_controller: prompts/phase2/topic_controller.md
    manager:
      research: prompts/phase3/research_manager.md
    trader: prompts/phase4/trader.md
    risk:
      aggressive: prompts/phase5/aggressive.md
      neutral: prompts/phase5/neutral.md
      conservative: prompts/phase5/conservative.md
    portfolio:
      manager: prompts/phase6/portfolio_manager.md

  llm:
    gateway:
      base_url: &llm_gateway_base_url ${LLM_GATEWAY_BASE_URL}
      # Require an env-provided key; never ship a real default secret in-repo.
      api_key: &llm_gateway_api_key ${LLM_GATEWAY_API_KEY}
    defaults:
      # free_opencode: 开启后直接无视上面的 gateway.base_url / gateway.api_key 以及下面的
      #   model，固定以 chat_completions 模式调用 opencode 免费网关
      #   (https://opencode.ai/zen/v1) 的 deepseek-v4-flash-free 模型，并自动附带
      #   opencode 所需的全部请求头。设为 false 时回退到常规 gateway 配置。
      free_opencode: false
      route: chat_completions
      model: gpt-5.3-codex-spark
      base_url: *llm_gateway_base_url
      api_key: *llm_gateway_api_key
      # The gateway's implicit cap truncates schema-valid multi-agent artifacts.
      # Roles may lower this explicitly, but the workflow needs room for
      # schema-valid multi-agent artifacts and bounded evidence fields.
      max_completion_tokens: 12288
      reasoning_effort: low
      reasoning_summary: auto
      preserve_reasoning_state: false
  web_search:
    mode: live
    provider: exa
    base_url: https://mcp.exa.ai/mcp
    context_size: medium
    max_result_chars: 12000

technical:
  source: alpaca
  days: 60
  sleep_sec: 1
  parallelism: 10
  alpaca:
    # IEX is available on Alpaca Basic. Intraday bars include pre-market and after-hours trades.
    feed: iex
    extended_hours: true
  # Alpaca stock bars do not provide VIX OHLC.
  yahoo_fallback_symbols: [VIX]

jin10:
  api_url: https://4a735ea38f8146198dc205d2e2d1bd28.z3c.jin10.com/flash
  channel: -8200
  vip: 1
  classify: 53,76,83,86,90,92,118,79,25,24,16,18,2,3,27
  lookback_hours: 24.0
  pages: 200
  timeout: 15.0

report:
  email:
    enabled: true
    smtp_url: smtps://smtp.mail.me.com:465
    username: ${REPORT_SMTP_USERNAME}
    password: ${REPORT_SMTP_PASSWORD}
    from: ${REPORT_SMTP_FROM}
    to: ${REPORT_SMTP_TO}
