[daemon]
store_root = ".akzio/store"
http_addr = "127.0.0.1:7342"
# The CLI generates or reads `.daemon-token` under `store_root`.
worker_count = 4
# Keep disabled until credentials, Paper approval, market clock, and release
# evidence have been reviewed for the intended broker session.
auto_paper = false

[execution]
experiment_profile = "paper-research"
assets = ["TQQQ", "QQQ", "SOXX", "SOXL"]
market_data_feed = "sip"
transaction_cost_ppm = 100
slippage_ppm = 50
# Optional Rust-produced frozen JSON snapshot. Build it from independent
# historical forecast/realized-return samples with `akzio calibration build`.
# When omitted, built-in decision policy is fail-closed and cannot create a
# non-zero target. See docs/offline-calibration-bootstrap.md.
# decision_policy_path = "/absolute/path/to/frozen-decision-policy.json"

[model]
provider = "openai_responses"
base_url = "https://api.openai.com/v1"
model = "gpt-5.6-luna"
# Required for canonical research profiles. Replace both placeholders with
# provider-published dates for the exact pinned snapshot before loading.
release_date = "REPLACE_WITH_YYYY-MM-DD"
knowledge_cutoff = "REPLACE_WITH_YYYY-MM-DD"
api_key = "$OPENAI_API_KEY"
reasoning_effort = "medium"
response_language = "简体中文"
debug = false

[model.routes.'research.planner']
model = "gpt-5.6-luna"
reasoning_effort = "medium"

[model.routes.'research.analyst']
model = "gpt-5.6-luna"
reasoning_effort = "high"

[model.routes.'research.critic']
model = "gpt-5.6-sol"
reasoning_effort = "high"

[model.routes.'research.synthesizer']
model = "gpt-5.6-luna"
reasoning_effort = "high"

# Optional dedicated hosted-search route. Leave absent to probe/use the shared
# default route; if present, its capability snapshot must independently verify
# Responses web_search before NewsWeb is registered.
# [model.routes.'evidence.news_web']
# model = "REPLACE_WITH_AUTHORIZED_SEARCH_MODEL"
# reasoning_effort = "medium"

[model.routes.'learning.outcome_worker']
model = "gpt-5.6-luna"
reasoning_effort = "medium"

[credentials]
alpaca_api_key = ""
alpaca_api_secret = ""
fred_api_key = ""

[observatory]
