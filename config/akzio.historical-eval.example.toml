[daemon]
store_root = ".akzio/store"
http_addr = "127.0.0.1:7342"
# The CLI generates or reads `.daemon-token` under `store_root`.
worker_count = 4
auto_paper = false

[execution]
experiment_profile = "historical-eval"
historical_evaluation_condition = "fully_masked"
assets = ["TQQQ", "QQQ", "SOXX", "SOXL"]
market_data_feed = "sip"
transaction_cost_ppm = 100
slippage_ppm = 50
# Optional operator-produced frozen JSON snapshot. Its active calibration scope
# must match the configured research.synthesizer model/version identity.
# decision_policy_path = "/absolute/path/to/frozen-decision-policy.json"

[model]
provider = "openai_responses"
base_url = "https://api.openai.com/v1"
model = "REPLACE_WITH_PINNED_MODEL_SNAPSHOT"
release_date = "REPLACE_WITH_YYYY-MM-DD"
knowledge_cutoff = "REPLACE_WITH_YYYY-MM-DD"
api_key = "$OPENAI_API_KEY"
reasoning_effort = "medium"
response_language = "简体中文"
debug = false

[model.routes.'research.planner']
model = "REPLACE_WITH_PINNED_PLANNER_SNAPSHOT"
reasoning_effort = "medium"

[model.routes.'research.analyst']
model = "REPLACE_WITH_PINNED_ANALYST_SNAPSHOT"
reasoning_effort = "high"

[model.routes.'research.critic']
model = "REPLACE_WITH_PINNED_CRITIC_SNAPSHOT"
reasoning_effort = "high"

[model.routes.'research.synthesizer']
model = "REPLACE_WITH_PINNED_SYNTHESIZER_SNAPSHOT"
reasoning_effort = "high"
